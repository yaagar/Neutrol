[package]
name = "neutrol"
version = "0.1.0"
description = "Neutrol — Open-source EEG development platform"
authors = []
edition = "2021"

[package.metadata.bundle]
identifier = "com.neutrol.app"
icon = ["icons/icon.ico"]

# The lib target lets `tauri-build` generate the correct entry points.
[lib]
name = "neutrol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri             = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"

# Release profile: small binary, fast startup.
[profile.release]
panic        = "abort"
codegen-units = 1
lto          = true
opt-level    = "s"
strip        = true
